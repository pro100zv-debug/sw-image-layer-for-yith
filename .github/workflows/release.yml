# Publica una versión del plugin.
#
# Dos formas de lanzarla:
#  1. Cambiar «Version:» en sw-image-layer-for-yith.php y subirlo a main.
#     Si todavía no existe el release vX.Y.Z, se crea con la etiqueta, el ZIP
#     y, como descripción, la sección «### X.Y.Z» del apartado «Cambios» de README.md.
#  2. Publicar un release a mano en GitHub: solo se le adjunta el ZIP.
#
# El ZIP se llama siempre sw-image-layer-for-yith.zip: lo usan las actualizaciones
# de WordPress y el enlace de descarga
# https://github.com/pro100zv-debug/sw-image-layer-for-yith/releases/latest/download/sw-image-layer-for-yith.zip
name: Publicar versión

on:
  push:
    branches: [main]
    paths: ['sw-image-layer-for-yith.php']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      rehacer:
        description: 'Borrar el release y la etiqueta de esta versión y publicarlos de nuevo'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Datos de la versión
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 -E '^\s*\*\s*Version:' sw-image-layer-for-yith.php | sed -E 's/.*Version:\s*//; s/\s+$//')
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            if [ "${TAG#v}" != "$VERSION" ]; then
              echo "::error::El release $TAG no coincide con Version: $VERSION en sw-image-layer-for-yith.php"
              exit 1
            fi
            echo "mode=upload" >> "$GITHUB_OUTPUT"
          else
            TAG="v$VERSION"
            if [ "${{ inputs.rehacer }}" = "true" ]; then
              echo "Rehacer: se borran el release y la etiqueta $TAG."
              gh release delete "$TAG" --yes --cleanup-tag || true
              git push --delete origin "$TAG" 2>/dev/null || true
            fi
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "El release $TAG ya existe: no se publica nada."
              echo "mode=skip" >> "$GITHUB_OUTPUT"
            else
              echo "mode=create" >> "$GITHUB_OUTPUT"
            fi
          fi
          # Notas: sección «### VERSION» de README.md, hasta el siguiente título
          awk -v v="### $VERSION" '
            $0 == v {on=1; next}
            on && /^#{2,3} / {exit}
            on {print}
          ' README.md > /tmp/notas.md
          [ -s /tmp/notas.md ] || echo "Versión $VERSION." > /tmp/notas.md
          echo "Etiqueta: $TAG"; cat /tmp/notas.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Crear el ZIP
        if: steps.v.outputs.mode != 'skip'
        run: |
          mkdir -p /tmp/build/sw-image-layer-for-yith
          rsync -a ./ /tmp/build/sw-image-layer-for-yith/ \
            --exclude='.git' --exclude='.github' --exclude='.wp-assets' --exclude='.gitignore'
          cd /tmp/build
          zip -r sw-image-layer-for-yith.zip sw-image-layer-for-yith

      - name: Crear el release
        if: steps.v.outputs.mode == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub a veces responde 502: se reintenta hasta 5 veces
          for i in 1 2 3 4 5; do
            if gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
              echo "Release creado."; exit 0
            fi
            gh release create "${{ steps.v.outputs.tag }}" \
              --target "${{ github.sha }}" \
              --title "${{ steps.v.outputs.version }}" \
              --notes-file /tmp/notas.md || true
            sleep $((i * 5))
          done
          gh release view "${{ steps.v.outputs.tag }}" >/dev/null

      - name: Adjuntar el ZIP
        if: steps.v.outputs.mode != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5; do
            gh release upload "${{ steps.v.outputs.tag }}" /tmp/build/sw-image-layer-for-yith.zip --clobber || true
            if gh release view "${{ steps.v.outputs.tag }}" --json assets --jq '.assets[].name' | grep -qx 'sw-image-layer-for-yith.zip'; then
              echo "ZIP adjuntado."; exit 0
            fi
            sleep $((i * 5))
          done
          echo "::error::No se pudo adjuntar el ZIP"; exit 1
